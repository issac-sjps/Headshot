<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>證件照裁切工具</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- TensorFlow.js + Body Segmentation + MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.11.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.11.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.11.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation@1.0.1/dist/body-segmentation.min.js"></script>

<style>
  :root {
    --bg: #0f0f13; --surface: #1a1a22; --surface2: #24242f;
    --border: #32323f; --accent: #d4f54a; --accent-dim: #a8c23a;
    --accent2: #6ef7cb; --red: #ff6b6b; --text: #eeeef5;
    --muted: #7a7a8e; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; padding: 24px 16px 60px; }
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-family: 'Space Mono', monospace; font-size: clamp(1.4rem,4vw,2rem); letter-spacing: -0.02em; color: var(--accent); }
  .header p { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }
  .app { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-title { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-title::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }

  .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 48px 24px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(212,245,74,.04); }
  .upload-icon { font-size: 3rem; margin-bottom: 12px; display: block; }
  .upload-zone h3 { font-size: 1rem; font-weight: 500; margin-bottom: 6px; }
  .upload-zone p { font-size: .82rem; color: var(--muted); }
  #fileInput { display: none; }

  .presets { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
  @media(min-width:480px){ .presets { grid-template-columns: repeat(4,1fr); } }
  .preset-btn { background: var(--surface2); border: 2px solid var(--border); border-radius: var(--radius); padding: 14px 10px; cursor: pointer; text-align: center; transition: all .18s; color: var(--text); font-family: 'Noto Sans TC', sans-serif; }
  .preset-btn:hover { border-color: var(--accent); background: rgba(212,245,74,.06); }
  .preset-btn.active { border-color: var(--accent); background: rgba(212,245,74,.1); }
  .preset-btn .preset-name { font-size: .9rem; font-weight: 700; display: block; margin-bottom: 4px; }
  .preset-btn .preset-size { font-size: .72rem; color: var(--muted); display: block; }
  .preset-btn.active .preset-name { color: var(--accent); }
  .preset-btn.active .preset-size { color: var(--accent-dim); }

  .crop-section { display: none; }
  .crop-section.visible { display: block; }
  .crop-container { width: 100%; max-height: 500px; background: #111; border-radius: var(--radius); overflow: hidden; }
  .crop-container img { display: block; max-width: 100%; }

  .controls-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .ctrl-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 14px; font-size: .82rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: border-color .15s, background .15s; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; }
  .ctrl-btn:hover { border-color: var(--accent2); background: rgba(110,247,203,.06); }
  .ctrl-btn:disabled { opacity: .4; cursor: not-allowed; }

  .bg-panel { margin-top: 14px; padding: 14px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .bg-panel-label { font-size: .82rem; color: var(--muted); flex-shrink: 0; }
  .swatch-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; transition: border-color .15s, transform .15s; flex-shrink: 0; }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(212,245,74,.4); }
  .swatch-white { background: #fff; }
  .swatch-light { background: #dce8f0; }
  .swatch-gray  { background: #ccc; }
  .swatch-custom { background: linear-gradient(135deg,#f00,#0f0,#00f); position: relative; overflow: hidden; }
  #customColorInput { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; top: 0; left: 0; }

  .btn-rmbg { background: transparent; border: 1.5px solid var(--accent2); color: var(--accent2); border-radius: 8px; padding: 8px 16px; font-size: .82rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: background .15s; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn-rmbg:hover { background: rgba(110,247,203,.08); }
  .btn-rmbg:disabled { opacity: .4; cursor: not-allowed; }

  .progress-bar-wrap { width: 100%; background: var(--border); border-radius: 30px; height: 6px; overflow: hidden; display: none; flex-basis: 100%; }
  .progress-bar-wrap.visible { display: block; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 30px; width: 0%; transition: width .4s; }
  .progress-text { font-size: .72rem; color: var(--accent2); flex-basis: 100%; display: none; font-family: 'Space Mono', monospace; }
  .progress-text.visible { display: block; }

  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media(min-width:600px){ .settings-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .field label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }
  .field select, .field input[type=number] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px 12px; font-size: .85rem; outline: none; font-family: 'Noto Sans TC', sans-serif; transition: border-color .15s; }
  .field select:focus, .field input[type=number]:focus { border-color: var(--accent); }
  .field input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

  .preview-section { display: none; }
  .preview-section.visible { display: block; }
  .preview-wrap { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; margin-top: 18px; }
  .preview-box { border-radius: 4px; overflow: hidden; flex-shrink: 0; box-shadow: 0 4px 20px rgba(0,0,0,.5); border: 1px solid var(--border); background-image: linear-gradient(45deg,#444 25%,transparent 25%), linear-gradient(-45deg,#444 25%,transparent 25%), linear-gradient(45deg,transparent 75%,#444 75%), linear-gradient(-45deg,transparent 75%,#444 75%); background-size: 12px 12px; background-position: 0 0,0 6px,6px -6px,-6px 0; background-color: #2a2a2a; }
  .preview-box canvas { display: block; }
  .preview-info { flex: 1; min-width: 200px; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .83rem; }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--muted); }
  .info-val { font-family: 'Space Mono', monospace; color: var(--accent2); font-size: .8rem; }

  .size-badge { display: inline-block; background: rgba(212,245,74,.12); border: 1px solid rgba(212,245,74,.3); border-radius: 20px; padding: 2px 10px; font-size: .72rem; color: var(--accent); font-family: 'Space Mono', monospace; margin-left: 6px; vertical-align: middle; }

  .btn-download { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: var(--accent); color: #111; border: none; border-radius: var(--radius); padding: 15px 24px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; letter-spacing: .04em; transition: background .15s, transform .1s; margin-top: 16px; }
  .btn-download:hover { background: #e5ff60; transform: translateY(-1px); }
  .btn-download:active { transform: translateY(0); }

  .file-size-estimate { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 10px; font-family: 'Space Mono', monospace; padding: 8px 12px; background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); display: none; }
  .file-size-estimate span { color: var(--accent); font-weight: 700; font-size: .9rem; }

  .steps { display: flex; margin-bottom: 4px; }
  .step { flex: 1; text-align: center; padding: 8px 4px; font-size: .72rem; color: var(--muted); border-bottom: 2px solid var(--border); letter-spacing: .04em; transition: color .2s, border-color .2s; }
  .step.active { color: var(--accent); border-color: var(--accent); }
  .step.done   { color: var(--accent2); border-color: var(--accent2); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--accent); color: var(--accent); padding: 10px 22px; border-radius: 30px; font-size: .83rem; pointer-events: none; transition: transform .3s; z-index: 9999; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--red); color: var(--red); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }

  /* A4 sheet */
  .a4-divider { border: none; border-top: 1px dashed var(--border); margin: 28px 0 20px; }
  .a4-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; margin-top: 4px; }
  @media(min-width:600px){ .a4-grid { grid-template-columns: repeat(4,1fr); } }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: .85rem; margin-top: 14px; cursor: pointer; }
  .check-row input { accent-color: var(--accent); width: 16px; height: 16px; }
  .a4-preview-wrap { margin-top: 18px; display: flex; justify-content: center; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .a4-preview-wrap canvas { max-width: 100%; height: auto; box-shadow: 0 4px 24px rgba(0,0,0,.6); background: #fff; }
  .a4-info { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 10px; font-family: 'Space Mono', monospace; }
  .a4-info span { color: var(--accent); font-weight: 700; }
  .btn-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
  @media(min-width:600px){ .btn-row { grid-template-columns: repeat(3,1fr); } }
  .btn-row .btn-download { margin-top: 0; font-size: .92rem; padding: 13px 12px; }
  .btn-alt { background: transparent !important; color: var(--accent) !important; border: 1.5px solid var(--accent) !important; }
  .btn-alt:hover { background: rgba(212,245,74,.08) !important; }
  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    body { background: #fff !important; padding: 0 !important; min-height: 0 !important; }
    #printArea { display: block !important; }
    #printArea img { display: block; width: 100%; height: auto; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📸 證件照裁切工具</h1>
  <p>上傳 → 選規格 → 裁切 → AI去背 → 調整 → 下載 / A4 列印</p>
</div>

<div class="app">
  <div class="steps">
    <div class="step active" id="step1">① 上傳</div>
    <div class="step" id="step2">② 規格＆裁切</div>
    <div class="step" id="step3">③ 調整＆下載</div>
  </div>

  <!-- Upload -->
  <div class="card">
    <div class="card-title">上傳照片</div>
    <div class="upload-zone" id="uploadZone">
      <span class="upload-icon">🖼️</span>
      <h3>點擊選擇照片，或拖曳到此處</h3>
      <p>支援 JPG、PNG、WEBP</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
    </div>
  </div>

  <!-- Presets -->
  <div class="card crop-section" id="presetCard">
    <div class="card-title">選擇照片規格</div>
    <div class="presets">
      <button class="preset-btn active" data-w="35" data-h="45" data-px="413" onclick="setPreset(this)">
        <span class="preset-name">2吋大頭照</span><span class="preset-size">3.5 × 4.5 cm</span>
      </button>
      <button class="preset-btn" data-w="47" data-h="42" data-px="554" onclick="setPreset(this)">
        <span class="preset-name">2吋半身照</span><span class="preset-size">4.7 × 4.2 cm</span>
      </button>
      <button class="preset-btn" data-w="35" data-h="28" data-px="413" onclick="setPreset(this)">
        <span class="preset-name">1吋證件照</span><span class="preset-size">3.5 × 2.8 cm</span>
      </button>
      <button class="preset-btn" data-w="50" data-h="50" data-px="590" onclick="setPreset(this)">
        <span class="preset-name">5 × 5</span><span class="preset-size">5.0 × 5.0 cm</span>
      </button>
    </div>
  </div>

  <!-- Crop -->
  <div class="card crop-section" id="cropCard">
    <div class="card-title">
      裁切照片
      <span id="currentPresetLabel" class="size-badge">2吋大頭照 (3.5×4.5 cm)</span>
    </div>
    <div class="crop-container">
      <img id="cropImage" src="" alt="裁切圖片">
    </div>
    <div class="controls-row">
      <button class="ctrl-btn" onclick="cropper.rotate(-90)">↺ 左旋90°</button>
      <button class="ctrl-btn" onclick="cropper.rotate(90)">↻ 右旋90°</button>
      <button class="ctrl-btn" onclick="flipH()">⇄ 水平翻轉</button>
      <button class="ctrl-btn" onclick="flipV()">⇅ 垂直翻轉</button>
      <button class="ctrl-btn" onclick="cropper.reset();scaleX=1;scaleY=1;">⟳ 重置</button>
      <button class="ctrl-btn" onclick="triggerPreview()"
        style="margin-left:auto;border-color:var(--accent);color:var(--accent);font-weight:700;">
        ✂️ 確認裁切
      </button>
    </div>

    <div class="bg-panel">
      <span class="bg-panel-label">🎨 背景顏色：</span>
      <div class="swatch-row">
        <div class="swatch swatch-white active" title="白色" onclick="selectBg(this,'#ffffff')"></div>
        <div class="swatch swatch-light"        title="淺藍" onclick="selectBg(this,'#dce8f0')"></div>
        <div class="swatch swatch-gray"         title="淺灰" onclick="selectBg(this,'#cccccc')"></div>
        <div class="swatch swatch-custom" title="自訂顏色">
          <input type="color" id="customColorInput" value="#ffffff" oninput="onCustomColor(this)">
        </div>
      </div>
      <button class="btn-rmbg" id="rmbgBtn" onclick="removeBackground()">
        ✨ AI 自動去背景
      </button>
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText"></div>
    </div>
  </div>

  <!-- Settings + Preview -->
  <div class="card preview-section" id="previewCard">
    <div class="card-title">輸出設定與預覽</div>
    <div class="settings-grid">
      <div class="field">
        <label>檔案格式</label>
        <select id="formatSelect" onchange="updatePreview()">
          <option value="image/jpeg">JPG（較小）</option>
          <option value="image/png">PNG（無損）</option>
          <option value="image/webp">WEBP（最小）</option>
        </select>
      </div>
      <div class="field">
        <label>輸出寬度（像素）</label>
        <input type="number" id="outWidth" value="413" min="100" max="3000" step="1" onchange="updatePreview()">
      </div>
      <div class="field">
        <label>壓縮品質 <span id="qualityVal" class="size-badge">90%</span></label>
        <input type="range" id="qualityRange" min="10" max="100" value="90" step="1"
          oninput="document.getElementById('qualityVal').textContent=this.value+'%';updatePreview()">
      </div>
    </div>

    <div class="preview-wrap">
      <div class="preview-box" id="previewBox">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="preview-info">
        <div class="info-row"><span class="info-label">規格</span><span class="info-val" id="infoPreset">—</span></div>
        <div class="info-row"><span class="info-label">輸出尺寸（px）</span><span class="info-val" id="infoPx">—</span></div>
        <div class="info-row"><span class="info-label">格式</span><span class="info-val" id="infoFmt">—</span></div>
        <div class="info-row"><span class="info-label">背景</span><span class="info-val" id="infoBg">—</span></div>
        <div class="info-row"><span class="info-label">預估檔案大小</span><span class="info-val" id="infoSize">—</span></div>
        <div class="info-row"><span class="info-label">300 DPI 印刷尺寸</span><span class="info-val" id="infoCm">—</span></div>
      </div>
    </div>

    <button class="btn-download" onclick="downloadImage()">⬇ 下載照片</button>
    <div class="file-size-estimate" id="fileSizeEstimate">
      預估下載大小：<span id="fileSizeVal">—</span>
    </div>

    <hr class="a4-divider">
    <div class="card-title">🖨️ A4 列印排版（可剪下使用）</div>
    <div class="a4-grid">
      <div class="field">
        <label>紙張方向</label>
        <select id="a4Orient" onchange="renderA4Preview()">
          <option value="portrait">直向</option>
          <option value="landscape">橫向</option>
        </select>
      </div>
      <div class="field">
        <label>張數（0 = 填滿整頁）</label>
        <input type="number" id="a4Count" value="0" min="0" max="200" step="1" onchange="renderA4Preview()" oninput="renderA4Preview()">
      </div>
      <div class="field">
        <label>照片間距 (mm)</label>
        <input type="number" id="a4Gap" value="3" min="0" max="20" step="0.5" onchange="renderA4Preview()" oninput="renderA4Preview()">
      </div>
      <div class="field">
        <label>紙張邊距 (mm)</label>
        <input type="number" id="a4Margin" value="8" min="0" max="30" step="0.5" onchange="renderA4Preview()" oninput="renderA4Preview()">
      </div>
    </div>
    <label class="check-row"><input type="checkbox" id="a4Cut" checked onchange="renderA4Preview()"> 顯示裁切線（照片外框細灰線，沿線剪下）</label>

    <div class="a4-preview-wrap"><canvas id="a4Canvas"></canvas></div>
    <div class="a4-info" id="a4Info">—</div>

    <div class="btn-row">
      <button class="btn-download" onclick="downloadA4('pdf')">⬇ 下載 A4 PDF</button>
      <button class="btn-download btn-alt" onclick="downloadA4('jpg')">⬇ 下載 A4 圖片 (JPG)</button>
      <button class="btn-download btn-alt" onclick="printA4()">🖨️ 直接列印</button>
    </div>
    <p class="a4-info" style="margin-top:12px;font-family:'Noto Sans TC',sans-serif;">
      💡 列印時請選「實際大小 / 100%」，不要選「縮放至符合頁面」，尺寸才會準確。
    </p>
  </div>
</div>

<div id="printArea"></div>

<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
/* ── globals ── */
let cropper       = null;
let scaleX        = 1, scaleY = 1;
let curW          = 35, curH = 45;
let curName       = '2吋大頭照', curSizeCm = '3.5 × 4.5 cm';
let croppedBlob   = null;
let bgColor       = '#ffffff';
let useRemovedBg  = false;
// stores raw RGBA ImageData of the person with transparent bg (result of segmentation)
let maskedImageData = null;
// cache of the last cropped canvas (for re-compositing when bg color changes)
let lastCroppedCanvas = null;
let segmenter     = null;
let lastFinalCanvas = null;

/* ── Upload ── */
const uploadZone = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  if (!file.type.startsWith('image/')) { showToast('⚠️ 請上傳圖片檔案', true); return; }
  maskedImageData = null; useRemovedBg = false; lastCroppedCanvas = null;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('cropImage').src = e.target.result;
    document.querySelectorAll('.crop-section').forEach(el => el.classList.add('visible'));
    document.getElementById('previewCard').classList.remove('visible');
    setStep(2);
    initCropper();
  };
  reader.readAsDataURL(file);
}

/* ── Cropper ── */
function initCropper() {
  if (cropper) { cropper.destroy(); cropper = null; }
  scaleX = 1; scaleY = 1;
  cropper = new Cropper(document.getElementById('cropImage'), {
    aspectRatio: curW / curH,
    viewMode: 1, dragMode: 'move', autoCropArea: 0.85,
    responsive: true, background: false, guides: true, center: true, highlight: false,
  });
}
function flipH() { scaleX *= -1; cropper.scaleX(scaleX); }
function flipV() { scaleY *= -1; cropper.scaleY(scaleY); }

/* ── Preset ── */
function setPreset(btn) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curW = parseInt(btn.dataset.w); curH = parseInt(btn.dataset.h);
  curName = btn.querySelector('.preset-name').textContent;
  curSizeCm = btn.querySelector('.preset-size').textContent;
  document.getElementById('currentPresetLabel').textContent = curName + ' (' + curSizeCm + ')';
  document.getElementById('outWidth').value = btn.dataset.px || 413;
  if (cropper) { cropper.setAspectRatio(curW / curH); cropper.reset(); scaleX = 1; scaleY = 1; }
  maskedImageData = null; useRemovedBg = false; lastCroppedCanvas = null;
}

/* ── Background color ── */
function selectBg(el, color) {
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  bgColor = color;
  if (document.getElementById('previewCard').classList.contains('visible')) updatePreview();
}
function onCustomColor(input) {
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  document.querySelector('.swatch-custom').classList.add('active');
  bgColor = input.value;
  if (document.getElementById('previewCard').classList.contains('visible')) updatePreview();
}

/* ── Load segmenter (lazy, cached) ── */
async function getSegmenter() {
  if (segmenter) return segmenter;
  await tf.setBackend('webgl');
  await tf.ready();
  segmenter = await bodySegmentation.createSegmenter(
    bodySegmentation.SupportedModels.MediaPipeSelfieSegmentation,
    {
      runtime: 'tfjs',
      modelType: 'general'
    }
  );
  return segmenter;
}

/* ── AI Remove Background ── */
async function removeBackground() {
  if (!cropper) { showToast('⚠️ 請先上傳照片', true); return; }

  const btn          = document.getElementById('rmbgBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar  = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 載入 AI 模型…';
  progressWrap.classList.add('visible');
  progressText.classList.add('visible');
  progressBar.style.width = '10%';
  progressText.textContent = '初始化 MediaPipe 模型（首次約 10 秒）…';

  try {
    const seg = await getSegmenter();

    progressBar.style.width = '50%';
    progressText.textContent = '辨識人物輪廓中…';

    const w = parseInt(document.getElementById('outWidth').value) || 413;
    const h = Math.round(w / (curW / curH));
    const srcCanvas = cropper.getCroppedCanvas({ width: w, height: h, imageSmoothingQuality: 'high' });
    lastCroppedCanvas = srcCanvas;

    // Run segmentation
    const people = await seg.segmentPeople(srcCanvas, {
      flipHorizontal: false,
      multiSegmentation: false,
      segmentBodyParts: false
    });

    if (!people || people.length === 0) {
      throw new Error('未偵測到人物，請確認照片清晰且有完整人臉');
    }

    progressBar.style.width = '80%';
    progressText.textContent = '套用遮罩…';

    // Get raw mask ImageData  (R channel = person probability 0–255)
    const maskData = await people[0].mask.toImageData();

    // Get source pixels
    const srcCtx = srcCanvas.getContext('2d');
    const srcPixels = srcCtx.getImageData(0, 0, w, h);

    // Apply mask: set alpha = mask R value
    for (let i = 0; i < w * h; i++) {
      srcPixels.data[i * 4 + 3] = maskData.data[i * 4];
    }

    maskedImageData = srcPixels;   // RGBA with transparent bg
    useRemovedBg    = true;

    progressBar.style.width = '100%';
    progressText.textContent = '✅ 去背景完成！';
    btn.disabled = false;
    btn.innerHTML = '✅ 重新去背景';

    // Show preview immediately
    triggerPreview();

    setTimeout(() => {
      progressWrap.classList.remove('visible');
      progressText.classList.remove('visible');
    }, 2500);

  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.innerHTML = '✨ AI 自動去背景';
    progressWrap.classList.remove('visible');
    progressText.classList.remove('visible');
    showToast('❌ ' + err.message, true);
  }
}

/* ── Compose final canvas (bg + masked person) ── */
function composeFinalCanvas(w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  if (useRemovedBg && maskedImageData) {
    // Fill background color
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, w, h);

    // Draw masked person on top
    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    tmp.getContext('2d').putImageData(maskedImageData, 0, 0);
    ctx.drawImage(tmp, 0, 0);
  } else {
    // No bg removal — just draw crop
    if (lastCroppedCanvas) {
      ctx.drawImage(lastCroppedCanvas, 0, 0, w, h);
    }
  }
  return canvas;
}

/* ── Confirm crop → show preview ── */
function triggerPreview() {
  if (!cropper) return;
  const w = parseInt(document.getElementById('outWidth').value) || 413;
  const h = Math.round(w / (curW / curH));

  if (!useRemovedBg) {
    const canvas = cropper.getCroppedCanvas({ width: w, height: h, imageSmoothingQuality: 'high' });
    if (!canvas) { showToast('⚠️ 請先上傳照片', true); return; }
    lastCroppedCanvas = canvas;
  }

  const final = composeFinalCanvas(w, h);
  renderPreview(final, w, h);
  document.getElementById('previewCard').classList.add('visible');
  setStep(3);
  setTimeout(() => document.getElementById('previewCard').scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
}

function updatePreview() {
  if (!cropper || !document.getElementById('previewCard').classList.contains('visible')) return;
  const w = parseInt(document.getElementById('outWidth').value) || 413;
  const h = Math.round(w / (curW / curH));

  if (!useRemovedBg) {
    const canvas = cropper.getCroppedCanvas({ width: w, height: h, imageSmoothingQuality: 'high' });
    if (canvas) { lastCroppedCanvas = canvas; }
  }

  // If size changed and bg was removed, we need to re-run segmentation
  if (useRemovedBg && maskedImageData &&
      (maskedImageData.width !== w || maskedImageData.height !== h)) {
    // Reset and ask user to re-run
    maskedImageData = null; useRemovedBg = false;
    document.getElementById('rmbgBtn').innerHTML = '✨ AI 自動去背景';
    showToast('⚠️ 輸出尺寸變更，請重新去背景');
  }

  const final = composeFinalCanvas(w, h);
  renderPreview(final, w, h);
}

/* ── Render preview ── */
function renderPreview(finalCanvas, w, h) {
  lastFinalCanvas = finalCanvas;
  const fmt     = document.getElementById('formatSelect').value;
  const quality = parseInt(document.getElementById('qualityRange').value) / 100;
  const ext     = fmt === 'image/jpeg' ? 'JPG' : fmt === 'image/png' ? 'PNG' : 'WEBP';

  // Small display preview
  const dW = Math.min(w, 180);
  const dH = Math.round(dW * h / w);
  const pc  = document.getElementById('previewCanvas');
  pc.width = dW; pc.height = dH;
  pc.getContext('2d').drawImage(finalCanvas, 0, 0, dW, dH);

  // Estimate file size from dataURL
  const dataUrl = finalCanvas.toDataURL(fmt, quality);
  const bytes   = Math.round(dataUrl.split(',')[1].length * 0.75);
  const sizeStr = formatBytes(bytes);

  const cmW = (w / 300 * 2.54).toFixed(1);
  const cmH = (h / 300 * 2.54).toFixed(1);

  document.getElementById('infoPreset').textContent = curName + ' (' + curSizeCm + ')';
  document.getElementById('infoPx').textContent     = w + ' × ' + h + ' px';
  document.getElementById('infoFmt').textContent    = ext + (fmt !== 'image/png' ? ' 品質 ' + Math.round(quality*100) + '%' : '');
  document.getElementById('infoBg').textContent     = useRemovedBg ? 'AI去背 + ' + bgColor : '原始';
  document.getElementById('infoSize').textContent   = sizeStr;
  document.getElementById('infoCm').textContent     = cmW + ' × ' + cmH + ' cm';

  const fse = document.getElementById('fileSizeEstimate');
  document.getElementById('fileSizeVal').textContent = sizeStr;
  fse.style.display = 'block';

  finalCanvas.toBlob(blob => { croppedBlob = blob; }, fmt, quality);
  renderA4Preview();
}

function formatBytes(b) {
  return b >= 1048576 ? (b / 1048576).toFixed(2) + ' MB' : Math.round(b / 1024) + ' KB';
}

/* ── Download ── */
function downloadImage() {
  if (!croppedBlob) { showToast('⚠️ 請先確認裁切', true); return; }
  const fmt  = document.getElementById('formatSelect').value;
  const ext  = fmt === 'image/jpeg' ? 'jpg' : fmt === 'image/png' ? 'png' : 'webp';
  const name = curName.replace(/\s/g, '_') + '.' + ext;
  const url  = URL.createObjectURL(croppedBlob);
  const a    = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('✅ 已下載：' + name + '（' + formatBytes(croppedBlob.size) + '）');
}


/* ── A4 sheet ── */
const A4_MM = { w: 210, h: 297 };

function a4Settings() {
  const landscape = document.getElementById('a4Orient').value === 'landscape';
  return {
    pageW: landscape ? A4_MM.h : A4_MM.w,
    pageH: landscape ? A4_MM.w : A4_MM.h,
    landscape,
    gap:    Math.max(0, parseFloat(document.getElementById('a4Gap').value) || 0),
    margin: Math.max(0, parseFloat(document.getElementById('a4Margin').value) || 0),
    count:  Math.max(0, parseInt(document.getElementById('a4Count').value) || 0),
    cut:    document.getElementById('a4Cut').checked
  };
}

function a4Layout(o) {
  const cols = Math.max(0, Math.floor((o.pageW - 2*o.margin + o.gap) / (curW/10*10 + o.gap)));
  const rows = Math.max(0, Math.floor((o.pageH - 2*o.margin + o.gap) / (curH/10*10 + o.gap)));
  return { cols, rows, max: cols * rows };
}

/* dpi: render resolution. Photo is drawn at its real physical size (curW × curH mm). */
function buildA4Canvas(dpi) {
  if (!lastFinalCanvas) return null;
  const o  = a4Settings();
  const L  = a4Layout(o);
  const mm = dpi / 25.4;
  const pw = curW, ph = curH;          // photo size in mm  (data-w / data-h are in mm)
  const cv = document.createElement('canvas');
  cv.width  = Math.round(o.pageW * mm);
  cv.height = Math.round(o.pageH * mm);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const total = o.count > 0 ? Math.min(o.count, L.max) : L.max;
  const gridW = L.cols * pw + (L.cols - 1) * o.gap;
  const x0 = (o.pageW - gridW) / 2;          // centered horizontally
  const y0 = o.margin;

  let n = 0;
  for (let r = 0; r < L.rows && n < total; r++) {
    for (let c = 0; c < L.cols && n < total; c++, n++) {
      const x = Math.round((x0 + c * (pw + o.gap)) * mm);
      const y = Math.round((y0 + r * (ph + o.gap)) * mm);
      const w = Math.round(pw * mm), h = Math.round(ph * mm);
      ctx.drawImage(lastFinalCanvas, x, y, w, h);
      if (o.cut) {
        const lw = Math.max(1, Math.round(dpi / 150));
        ctx.strokeStyle = '#9a9a9a';
        ctx.lineWidth = lw;
        ctx.strokeRect(x - lw/2, y - lw/2, w + lw, h + lw);   // drawn just outside the photo
      }
    }
  }
  cv._info = { total, max: L.max, cols: L.cols, rows: L.rows };
  return cv;
}

function renderA4Preview() {
  if (!lastFinalCanvas) return;
  const cv = buildA4Canvas(96);
  const pc = document.getElementById('a4Canvas');
  pc.width = cv.width; pc.height = cv.height;
  pc.getContext('2d').drawImage(cv, 0, 0);
  const i = cv._info;
  const info = document.getElementById('a4Info');
  if (i.max === 0) {
    info.innerHTML = '⚠️ 照片尺寸大於紙張可用範圍，請減少邊距';
  } else {
    info.innerHTML = '本頁共 <span>' + i.total + '</span> 張（每頁最多 ' + i.max + ' 張，' + i.cols + ' 欄 × ' + i.rows + ' 列）';
  }
}

function canvasToBytes(cv, q) {
  const b64 = cv.toDataURL('image/jpeg', q).split(',')[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

/* Minimal single-page PDF with one embedded JPEG */
function buildPdf(jpeg, pxW, pxH, ptW, ptH) {
  const enc = new TextEncoder();
  const parts = []; const offsets = []; let pos = 0;
  const push = d => { const u = typeof d === 'string' ? enc.encode(d) : d; parts.push(u); pos += u.length; };
  const obj = (n, body) => { offsets[n] = pos; push(n + ' 0 obj\n'); push(body); push('\nendobj\n'); };

  push('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + ptW.toFixed(2) + ' ' + ptH.toFixed(2) + '] ' +
         '/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offsets[4] = pos;
  push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + pxW + ' /Height ' + pxH +
       ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n');
  push(jpeg);
  push('\nendstream\nendobj\n');
  const content = 'q ' + ptW.toFixed(2) + ' 0 0 ' + ptH.toFixed(2) + ' 0 0 cm /Im0 Do Q';
  obj(5, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');

  const xref = pos;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  x += 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
  push(x);
  return new Blob(parts, { type: 'application/pdf' });
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function downloadA4(type) {
  if (!lastFinalCanvas) { showToast('⚠️ 請先確認裁切', true); return; }
  const o = a4Settings();
  if (a4Layout(o).max === 0) { showToast('⚠️ 照片大於紙張可用範圍', true); return; }
  const cv = buildA4Canvas(300);
  const base = 'A4_' + curName.replace(/\s/g, '_');
  if (type === 'pdf') {
    const jpeg = canvasToBytes(cv, 0.95);
    const blob = buildPdf(jpeg, cv.width, cv.height, o.pageW / 25.4 * 72, o.pageH / 25.4 * 72);
    saveBlob(blob, base + '.pdf');
    showToast('✅ 已下載 A4 PDF（' + formatBytes(blob.size) + '）');
  } else {
    cv.toBlob(b => { saveBlob(b, base + '.jpg'); showToast('✅ 已下載 A4 圖片（' + formatBytes(b.size) + '）'); }, 'image/jpeg', 0.95);
  }
}

function printA4() {
  if (!lastFinalCanvas) { showToast('⚠️ 請先確認裁切', true); return; }
  const o = a4Settings();
  if (a4Layout(o).max === 0) { showToast('⚠️ 照片大於紙張可用範圍', true); return; }
  const cv = buildA4Canvas(300);
  const img = new Image();
  img.onload = () => {
    let st = document.getElementById('pageStyle');
    if (!st) { st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
    st.textContent = '@page { size: A4 ' + (o.landscape ? 'landscape' : 'portrait') + '; margin: 0; }';
    const pa = document.getElementById('printArea');
    pa.innerHTML = ''; pa.appendChild(img);
    setTimeout(() => window.print(), 100);
  };
  img.src = cv.toDataURL('image/jpeg', 0.95);
}

/* ── Steps ── */
function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    document.getElementById('step' + i).className =
      'step' + (i < n ? ' done' : i === n ? ' active' : '');
  }
}

/* ── Toast ── */
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3500);
}
</script>
